name: Build 4CBOn2 Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # Agent work branches build and verify the APK before merge, but only main publishes it
      # (see the "Publish / refresh the rolling download release" step).
      - "arena/**"
    # Only real app/toolchain inputs retrigger a build. Documentation under android/*.md
    # does not, so a docs-only commit cannot quietly change the published APK checksum.
    paths:
      - "android/app/**"
      - "android/*.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
      - "android/debug.keystore"
      - "android/debug-signer.sha256"
      - ".github/workflows/build-debug-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
  ASSET_NAME: 4CBOn2-debug.apk

jobs:
  build:
    name: Debug APK
    if: github.repository == 'mohamtur1/4CBOn2'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One timestamp for the whole job. It is stamped into the APK (BuildConfig.BUILT_UTC, shown on
      # the app's Home screen) and into the release title and body, so the phone and the release
      # page say the same thing instead of differing by however long the build took.
      - name: Record the build timestamp
        shell: bash
        run: |
          set -euo pipefail
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "BUILD_UTC=$BUILD_UTC" >> "$GITHUB_ENV"
          echo "This build is stamped: $BUILD_UTC"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The debug identity is a committed file, not a cache entry: Actions caches are branch-scoped,
      # so a key saved by a work branch is invisible to a build on main and every branch minted its
      # own certificate. android/app/build.gradle.kts points the debug signingConfig straight at this
      # file, so no runner state is involved. Check it before spending 3 minutes on the build.
      - name: Check the committed debug keystore against the pin
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="android/debug.keystore"
          PIN_FILE="android/debug-signer.sha256"
          test -f "$KEYSTORE"
          test -f "$PIN_FILE"
          EXPECTED="$(tr -d '[:space:]' < "$PIN_FILE")"
          # keytool prints "Certificate fingerprint (SHA-256): AA:BB:..". Split on "label: value"
          # (-F': ') rather than a greedy sed, which would silently keep only the last hex pair.
          ACTUAL="$(keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            | awk -F': ' '/SHA-?256\)?:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Committed keystore certificate SHA-256: ${ACTUAL:-<unreadable>}"
          echo "Pinned in $PIN_FILE:                    $EXPECTED"
          if [ -z "$ACTUAL" ]; then
            echo "::error title=Unreadable keystore::keytool could not read an androiddebugkey certificate from $KEYSTORE with the public debug password."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error title=Keystore pin mismatch::$KEYSTORE holds $ACTUAL but $PIN_FILE pins $EXPECTED. Rotate both together (see android/DEBUG_SIGNING.md)."
            exit 1
          fi
          echo "KEYSTORE_SHA256=$ACTUAL" >> "$GITHUB_ENV"

      # Belt and braces: some tools still resolve the conventional location. The Gradle signing
      # config does not depend on it, so a runner without this file builds identically.
      - name: Mirror the keystore to the conventional debug location
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          cp android/debug.keystore "$HOME/.android/debug.keystore"
          echo "Mirrored to $HOME/.android/debug.keystore"

      - name: Download the Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            --output "$RUNNER_TEMP/android-commandline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"

      - name: Unpack the Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/android-commandline"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$RUNNER_TEMP/android-commandline"
          mv "$RUNNER_TEMP/android-commandline/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install the SDK packages this project needs
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          # compileSdk 37 ships as "android-37.0"; build-tools 36.0.0 is the verified set.
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" >/dev/null
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner"

      # Ask Gradle itself which key it will sign with, before the build spends 3 minutes finding out.
      # This is the check that was missing when a build silently signed with a runner-generated key
      # even though the committed keystore was present.
      - name: Confirm Gradle resolves the pinned debug signing config
        working-directory: android
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          LOG="$RUNNER_TEMP/signing-report.log"
          ./gradlew --no-daemon --console=plain --max-workers=1 :app:signingReport >"$LOG" 2>&1 \
            || echo "::warning title=signingReport failed::The pre-flight signing report did not run; the post-build pin check still enforces the identity. See the job log."
          {
            echo "### Gradle signing report (debug variant)"
            echo ""
            echo '```'
            awk '/Variant: debug/{f=1} f{print} /^----------/{if (f) exit}' "$LOG" | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          RESOLVED="$(awk '/Variant: debug/{f=1} f && /SHA-?256\)?:/{print; exit}' "$LOG" \
            | awk -F': ' '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          STORE="$(awk '/Variant: debug/{f=1} f && /^Store:/{print; exit}' "$LOG" | sed 's/^Store: *//')"
          echo "Gradle debug store file: ${STORE:-<unknown>}"
          echo "Gradle debug cert SHA-256: ${RESOLVED:-<unknown>}"
          if [ -z "$RESOLVED" ]; then
            echo "::warning title=Signing report unreadable::No certificate digest for the debug variant; relying on the post-build check."
          elif [ "$RESOLVED" != "$KEYSTORE_SHA256" ]; then
            echo "::error title=Gradle resolved a different signing key::Gradle will sign with $RESOLVED (store: ${STORE:-unknown}) but android/debug.keystore pins $KEYSTORE_SHA256. The explicit debug signingConfig in android/app/build.gradle.kts was not applied."
            exit 1
          else
            echo "Gradle resolves the pinned debug key ($RESOLVED)."
          fi

      - name: Assemble the debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          # -PbuiltUtc stamps the job's single build time into BuildConfig, which is what the app's
          # Home screen shows and what the release title says.
          ./gradlew --no-daemon --console=plain --max-workers=1 --stacktrace \
            -PbuiltUtc="$BUILD_UTC" :app:assembleDebug 2>&1 \
            | tee "$RUNNER_TEMP/gradle.log"

      - name: Surface Gradle errors as annotations and in the summary
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::The Gradle step produced no log file."
            exit 0
          fi
          python3 - "$LOG" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          print("tail-" + "=" * 60)
          print("\n".join(lines[-40:]))

          picks = [l for l in lines if l.startswith("e: ") or "error:" in l.lower()]
          if not picks:
              idx = [i for i, l in enumerate(lines) if "What went wrong" in l]
              if idx:
                  picks = lines[idx[0]: idx[0] + 18]
          if not picks:
              picks = lines[-15:]

          summary = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as fh:
              fh.write("## Gradle failure\n\n```\n" + "\n".join(picks[:40]) + "\n```\n")

          for line in picks[:15]:
              msg = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3500]
              print(f"::error title=Gradle::{msg}")
          PY

      - name: Verify the APK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -v 4 "$APK_PATH" >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH" | tee apksigner.txt
          SHA="$(sha256sum "$APK_PATH")"; SHA="${SHA%% *}"
          SIZE="$(stat -c%s "$APK_PATH")"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          CERT="$("$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i 'certificate SHA-256 digest' | head -n 1 | sed 's/^[^:]*: *//' || true)"
          VNAME="$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/')"
          VCODE="$(grep -oE 'versionCode = [0-9]+' android/app/build.gradle.kts | grep -oE '[0-9]+')"
          VERSION_LINE="${VNAME} (code ${VCODE})"
          {
            echo "## 4CBOn2 debug APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`$ASSET_NAME\` |"
            echo "| Built | ${BUILD_UTC:-unknown} |"
            echo "| Size | $SIZE bytes |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Package | \`io.github.mohamtur1.fourcbon2\` |"
            echo "| Build identity | \`$VERSION_LINE\` |"
            echo "| Signer | $CERT |"
            echo "| minSdk / targetSdk / compileSdk | 26 / 36 / 37 |"
            echo "| Build type | Debug (debug-signed, sideload only) |"
            echo ""
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "Download: <https://github.com/mohamtur1/4CBOn2/releases/download/4cbon2-debug-apk-latest/$ASSET_NAME>"
            else
              echo "Branch build: verified but **not published**. The rolling release only refreshes from \`main\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "APK_SHA256=$SHA"
            echo "APK_SIZE=$SIZE"
            echo "APK_SIGNER=$CERT"
            echo "APK_VERSION_LINE=$VERSION_LINE"
          } >> "$GITHUB_ENV"

      # An upgrade in place only works while the signing certificate stays the same. The pin file
      # holds that certificate's public SHA-256 digest, so any drift fails the build instead of
      # quietly shipping an APK that forces every owner to uninstall first.
      - name: Assert the signing certificate still matches the pin
        shell: bash
        run: |
          set -euo pipefail
          PIN_FILE="android/debug-signer.sha256"
          if [ ! -f "$PIN_FILE" ]; then
            echo "No signer pin yet; the expected digest for this build is $APK_SIGNER"
            echo "::warning title=Signer pin missing::Add $APK_SIGNER to $PIN_FILE once this build is confirmed."
            exit 0
          fi
          EXPECTED="$(tr -d '[:space:]' < "$PIN_FILE")"
          if [ -z "$APK_SIGNER" ]; then
            echo "::error title=Signer unreadable::apksigner reported no certificate digest for the built APK."
            exit 1
          fi
          if [ "$EXPECTED" != "$APK_SIGNER" ]; then
            echo "::error title=Signer drift::APK is signed by $APK_SIGNER but $PIN_FILE pins $EXPECTED. android/app/build.gradle.kts must point the debug signingConfig at android/debug.keystore."
            exit 1
          fi
          echo "Signer matches the pin ($EXPECTED)."

      - name: Copy the APK to a friendly file name
        shell: bash
        run: cp "$APK_PATH" "$ASSET_NAME"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4CBOn2-debug-apk
          path: 4CBOn2-debug.apk
          if-no-files-found: error

      # Only main publishes. A work branch can prove the APK builds and signs correctly, but the
      # rolling "latest" download must always come from merged code.
      - name: Publish / refresh the rolling download release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 4cbon2-debug-apk-latest
          # The title carries the build time on purpose: this is a rolling release, so GitHub keeps
          # showing the original publish date (31 October 2026) no matter how often the APK is
          # replaced, and "is this the new one?" was unanswerable from the releases list.
          name: 4CBOn2 Debug APK — built ${{ env.BUILD_UTC }}
          make_latest: true
          files: 4CBOn2-debug.apk
          body: |
            Debug-signed build of the 4CBOn2 Android app, built automatically by GitHub Actions.

            **Build record**

            | Field | Value |
            | --- | --- |
            | Built | ${{ env.BUILD_UTC }} |
            | Version | ${{ env.APK_VERSION_LINE }} |
            | Signer | `${{ env.APK_SIGNER }}` |
            | APK SHA-256 | `${{ env.APK_SHA256 }}` |
            | Size | ${{ env.APK_SIZE }} bytes |
            | Commit | `${{ github.sha }}` |
            | Branch / run | `${{ github.ref_name }}` / ${{ github.run_number }} |

            **How to confirm you installed this build:** open 4CBOn2 and read the stamp under the
            app name on the Home screen. It shows this same build time and version, plus whether
            the installed APK's own signing certificate matches the project's pinned key — if it
            ever says otherwise, do not trust that install. The stamp is read from the installed
            package, not typed in, so a repackaged APK cannot claim to be this build.

            Note that the date next to this release's title is the day it was first published
            (31 October 2026), not the day this APK was built. Use the build time above, or the
            asset's own timestamp, to tell builds apart.

            **Get it on your phone (GitHub mobile app or browser)**
            1. Open this release page — GitHub app: repo **mohamtur1/4CBOn2** → **Releases** →
               the release titled *4CBOn2 Debug APK — built …* (the newest one). Browser:
               <https://github.com/mohamtur1/4CBOn2/releases/latest>.
            2. Tap `4CBOn2-debug.apk` to download it.
            3. Open the downloaded file. If Android asks, allow "Install unknown apps"
               for the app you downloaded it with, then tap Install.
            4. Launch **4CBOn2** from the home screen and check the build stamp on Home.

            **One-time note for anyone upgrading from a build published before
            13 November 2026:** earlier builds were signed with a throwaway per-run
            key, so an old install will reject this one (*App not installed* /
            signature mismatch). Uninstall the old 4CBOn2 once, then install this
            APK. Every build from 13 November 2026 onward is signed with the same
            committed debug keystore (`android/debug.keystore`), so later upgrades
            install in place and keep their on-device data.

            Requires Android 8.0 or newer (API 26+).

            Personal build only: debug signature, no Play Store submission, and not yet
            a verified device-tested release. Source and build status live in the
            `android/` folder of the repository.

      - name: Note that a branch build does not publish
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Built and verified on \`${{ github.ref_name }}\`, not published: the rolling release only refreshes from \`main\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests (informational)
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --max-workers=1 :app:testDebugUnitTest
