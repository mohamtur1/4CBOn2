name: Build 4CBOn2 Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/5bb57085-4cbon2
    paths:
      - "android/**"
      - ".github/workflows/build-debug-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
  ASSET_NAME: 4CBOn2-debug.apk

jobs:
  build:
    name: Debug APK
    if: github.repository == 'mohamtur1/4CBOn2'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            --output "$RUNNER_TEMP/android-commandline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"

      - name: Unpack the Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/android-commandline"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$RUNNER_TEMP/android-commandline"
          mv "$RUNNER_TEMP/android-commandline/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install the SDK packages this project needs
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          # compileSdk 37 ships as "android-37.0"; build-tools 36.0.0 is the verified set.
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" >/dev/null
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner"

      - name: Run unit tests
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=1 :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Assemble the debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=1 --stacktrace :app:assembleDebug 2>&1 \
            | tee "$RUNNER_TEMP/gradle.log"

      - name: Surface Gradle errors as annotations and in the summary
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::The Gradle step produced no log file."
            exit 0
          fi
          python3 - "$LOG" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          print("tail-" + "=" * 60)
          print("\n".join(lines[-40:]))

          picks = [l for l in lines if l.startswith("e: ") or "error:" in l.lower() or " FAILED" in l]
          if not picks:
              idx = [i for i, l in enumerate(lines) if "What went wrong" in l]
              if idx:
                  picks = lines[idx[0]: idx[0] + 18]
          if not picks:
              picks = lines[-15:]

          summary = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as fh:
              fh.write("## Gradle failure\n\n```\n" + "\n".join(picks[:40]) + "\n```\n")

          for line in picks[:100]:
              msg = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3500]
              print(f"::error title=Gradle::{msg}")
          PY

      - name: Report failed unit tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('android/app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      msg = (case.get('classname', '') + '.' + case.get('name', '') + ': ' + failure.get('message', '')).replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                      print('::error title=Unit test::' + msg)
          PYTEST

      - name: Verify the APK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -v 4 "$APK_PATH" >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH" | tee apksigner.txt
          SHA="$(sha256sum "$APK_PATH")"; SHA="${SHA%% *}"
          SIZE="$(stat -c%s "$APK_PATH")"
          {
            echo "## 4CBOn2 debug APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`$ASSET_NAME\` |"
            echo "| Size | $SIZE bytes |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Package | \`io.github.mohamtur1.fourcbon2\` |"
            echo "| Version | 0.2.0-dev (code 2) |"
            echo "| minSdk / targetSdk / compileSdk | 26 / 36 / 37 |"
            echo "| Build type | Debug (debug-signed, sideload only) |"
            echo ""
            echo "Download: <https://github.com/mohamtur1/4CBOn2/releases/download/4cbon2-debug-apk-latest/$ASSET_NAME>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Copy the APK to a friendly file name
        shell: bash
        run: cp "$APK_PATH" "$ASSET_NAME"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4CBOn2-debug-apk
          path: 4CBOn2-debug.apk
          if-no-files-found: error

      - name: Publish / refresh the rolling download release
        if: false # Enable only after reviewing the complete test results.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 4cbon2-debug-apk-latest
          name: 4CBOn2 Debug APK (latest)
          make_latest: true
          files: 4CBOn2-debug.apk
          body: |
            Debug-signed build of the 4CBOn2 Android app, built automatically by
            GitHub Actions from commit `${{ github.sha }}`
            (branch `arena/5bb57085-4cbon2`, run ${{ github.run_number }}).

            **Install on an Android phone**
            1. Open this release page in the phone's browser.
            2. Tap `4CBOn2-debug.apk` to download it.
            3. Open the downloaded file. If Android asks, allow "Install unknown apps"
               for the browser you used, then tap Install.
            4. Launch the app from the home screen (name: **4CBOn2**).

            Requires Android 8.0 or newer (API 26+).

            Debug keys may differ between builds. Android may refuse an upgrade;
            uninstalling the old app removes its local data. Back up any important
            information before uninstalling.

            Personal build only: debug signature, no Play Store submission, and not yet
            a verified device-tested release. Source and build status live in the
            `android/` folder of the repository.

