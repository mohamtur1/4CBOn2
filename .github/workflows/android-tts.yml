name: Build TTS Queue Player APK

on:
  push:
    paths:
      - 'text-to-speech/android-app/**'
      - '.github/workflows/android-tts.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests + build debug APK
        run: gradle -p text-to-speech/android-app testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTSQueuePlayer-APK
          path: text-to-speech/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
