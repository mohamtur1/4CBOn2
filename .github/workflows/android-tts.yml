name: Build TTS Queue Player APK

on:
  push:
    paths:
      - 'text-to-speech/android-app/**'
      - '.github/workflows/android-tts.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK as a downloadable Release asset
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests + build debug APK
        run: |
          set -o pipefail
          gradle -p text-to-speech/android-app testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build-log.txt

      # Raw job logs are not fetchable from every environment, so re-publish the
      # important lines as annotations + job summary (both readable via the API).
      - name: Surface build errors
        if: failure()
        run: |
          test -f build-log.txt || exit 0
          {
            echo '## Gradle failure excerpt'
            echo '```'
            grep -nE '(^e: |error:|FAILED|FAILURE:|What went wrong|Execution failed|Caused by:|Unresolved reference|Type mismatch|AssertionError|expected)' build-log.txt | head -80
            echo '--- tail ---'
            tail -n 80 build-log.txt
            echo '```'
            for f in $(find text-to-speech/android-app/app/build/test-results -name '*.xml' 2>/dev/null | head -10); do
              echo "### $f"
              echo '```xml'
              grep -A6 -E '<failure|<error' "$f" | head -60
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^e: |error:|FAILED|FAILURE:)' build-log.txt | head -30 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-500)
            echo "::error::$clean"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTSQueuePlayer-APK
          path: text-to-speech/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the tts-latest release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp text-to-speech/android-app/app/build/outputs/apk/debug/app-debug.apk TTSQueuePlayer.apk
          if gh release view tts-latest >/dev/null 2>&1; then
            gh release upload tts-latest TTSQueuePlayer.apk --clobber
          else
            gh release create tts-latest TTSQueuePlayer.apk \
              --prerelease \
              --title "TTS Queue Player — latest build" \
              --notes "Installable Android APK (debug build, Android 8.0+). Tap TTSQueuePlayer.apk on your phone to download, then tap the file to install and allow 'install unknown apps' when asked. Rebuilt automatically on every push to the app."
          fi
