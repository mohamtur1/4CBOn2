# The current build sandbox has 1.9 GiB RAM and no swap. Keep the first prototype build single-worker.
# A 512 MiB/192 MiB heap/metaspace cap exhausted metaspace during the restored Division 10 build.
# The verified bounded configuration remains single-worker: 640 MiB heap and 384 MiB metaspace.
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx256m -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
